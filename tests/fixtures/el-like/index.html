<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>夹具：Element UI 风格简历页</title>
    <!-- 按智联招聘、企业自建招聘系统常见的 Element UI / Bootstrap 结构自行编写的静态夹具，不含任何第三方网站代码。 -->
    <style>
      body { font: 14px/1.6 system-ui, "Microsoft YaHei", sans-serif; margin: 0; background: #f5f6f8; }
      .page { max-width: 960px; margin: 20px auto; }
      .resume-block { background: #fff; border-radius: 8px; padding: 16px 20px; margin-bottom: 14px; }
      .resume-title { font-size: 18px; font-weight: 600; margin-bottom: 10px; }
      .resume-title .tip { color: #999; font-size: 12px; margin-left: 6px; }
      .side-nav { position: fixed; right: 10px; top: 80px; background: #fff; padding: 8px; }
      .el-form-item { display: flex; margin-bottom: 12px; }
      .el-form-item__label { width: 120px; text-align: right; padding-right: 12px; color: #606266; }
      .el-form-item__content { flex: 1; }
      .el-input__inner, .el-range-input { border: 1px solid #dcdfe6; border-radius: 4px; height: 32px; padding: 0 10px; }
      .el-range-editor { display: inline-flex; gap: 6px; align-items: center; }
      .el-radio { margin-right: 14px; }
      .add-btn { color: #1f6fff; cursor: pointer; }
      iframe { width: 100%; height: 220px; border: 0; background: #fff; border-radius: 8px; }
    </style>
  </head>
  <body>
    <div class="side-nav">
      <div class="menu-item">基本信息</div>
      <div class="menu-item">教育经历</div>
    </div>
    <div class="page">
      <div class="resume-block">
        <div class="resume-title">基本信息<span class="tip">(必填)</span></div>
        <form class="el-form" onsubmit="window.__submits=(window.__submits||0)+1;return false">
          <div class="el-form-item is-required">
            <label class="el-form-item__label">姓名</label>
            <div class="el-form-item__content"><div class="el-input"><input class="el-input__inner" type="text" autocomplete="off" /></div></div>
          </div>
          <div class="el-form-item">
            <label class="el-form-item__label">性别</label>
            <div class="el-form-item__content">
              <div class="el-radio-group" role="radiogroup">
                <label class="el-radio"><span class="el-radio__input"><input type="radio" class="el-radio__original" name="g" value="1" /></span><span class="el-radio__label">男</span></label>
                <label class="el-radio"><span class="el-radio__input"><input type="radio" class="el-radio__original" name="g" value="2" /></span><span class="el-radio__label">女</span></label>
              </div>
            </div>
          </div>
          <div class="el-form-item">
            <label class="el-form-item__label">出生日期</label>
            <div class="el-form-item__content"><div class="el-date-editor el-input el-date-editor--month"><input class="el-input__inner" readonly placeholder="选择月份" /></div></div>
          </div>
          <div class="el-form-item">
            <label class="el-form-item__label">政治面貌</label>
            <div class="el-form-item__content"><div class="el-select"><div class="el-input el-input--suffix"><input class="el-input__inner" readonly placeholder="请选择" /></div></div></div>
          </div>
          <div class="el-form-item">
            <label class="el-form-item__label">民族</label>
            <div class="el-form-item__content"><div class="el-select"><div class="el-input el-input--suffix"><input class="el-input__inner" readonly placeholder="请选择" value="汉族" /></div></div></div>
          </div>
          <div class="el-form-item">
            <label class="el-form-item__label">电子邮箱</label>
            <div class="el-form-item__content"><div class="el-input"><input class="el-input__inner" type="text" /></div></div>
          </div>
          <div class="el-form-item">
            <label class="el-form-item__label">证件号码</label>
            <div class="el-form-item__content"><div class="el-input is-disabled"><input class="el-input__inner" type="text" disabled value="" /></div></div>
          </div>
        </form>
      </div>

      <div class="resume-block">
        <div class="resume-title">教育经历</div>
        <form class="el-form">
          <div class="el-form-item">
            <label class="el-form-item__label">学校名称</label>
            <div class="el-form-item__content"><div class="el-select"><div class="el-input"><input class="el-input__inner" placeholder="请输入学校名称" /></div></div></div>
          </div>
          <div class="el-form-item">
            <label class="el-form-item__label">学历</label>
            <div class="el-form-item__content"><div class="el-select"><div class="el-input"><input class="el-input__inner" readonly placeholder="请选择" /></div></div></div>
          </div>
          <div class="el-form-item">
            <label class="el-form-item__label">专业名称</label>
            <div class="el-form-item__content"><div class="el-input"><input class="el-input__inner" /></div></div>
          </div>
          <div class="el-form-item">
            <label class="el-form-item__label">就读时间</label>
            <div class="el-form-item__content">
              <div class="el-date-editor el-range-editor el-input__inner"><input class="el-range-input" placeholder="开始月份" /><span>至</span><input class="el-range-input" placeholder="结束月份" /></div>
            </div>
          </div>
        </form>
      </div>

      <div class="resume-block">
        <div class="resume-title">项目经历</div>
        <span class="add-btn">+ 添加</span>
      </div>

      <!-- 同源内嵌框架（企业招聘系统常见） -->
      <iframe id="same" src="frame.html" title="同源表单"></iframe>
      <!-- 跨域内嵌框架：localhost 与 127.0.0.1 是不同的源 -->
      <iframe id="cross" src="http://localhost:4173/el-like/frame.html" title="跨域表单"></iframe>
    </div>
  </body>
</html>
