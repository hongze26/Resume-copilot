<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>夹具：内嵌招聘表单</title>
    <style>
      body { font: 14px/1.6 system-ui, "Microsoft YaHei", sans-serif; margin: 0; padding: 12px 16px; }
      .block-head { font-weight: 600; font-size: 16px; margin-bottom: 8px; }
      .form-group { display: flex; gap: 10px; margin-bottom: 8px; }
      .form-group .control-label { width: 100px; }
    </style>
  </head>
  <body>
    <div class="block-head">工作经历</div>
    <div class="form-group">
      <span class="control-label">单位名称</span>
      <input type="text" class="form-control" />
    </div>
    <div class="form-group">
      <span class="control-label">职位名称</span>
      <input type="text" class="form-control" />
    </div>
    <div class="form-group">
      <span class="control-label">工作内容</span>
      <textarea class="form-control"></textarea>
    </div>
  </body>
</html>
