<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>招聘平台·我的简历（Element UI 夹具）</title>
<link rel="stylesheet" href="app.css">
<style>
  body { margin: 0; font-family: sans-serif; background: #f2f2f2; }
  .layout { display: flex; gap: 16px; padding: 16px; max-width: 1100px; }
  .left_menu { width: 200px; flex: none; }
  .right_menu { flex: 1; }
  .option_list { list-style: none; padding: 0; }
  .option_list a { display: block; padding: 8px; color: #333; text-decoration: none; }
  .router-link-exact-active { color: #c00 !important; font-weight: bold; }
  .right_head { font-size: 18px; padding-bottom: 8px; border-bottom: 1px solid #ddd; margin-bottom: 8px; }
  .bar1 { font-weight: bold; padding: 10px 0; }
  .list-head { display: flex; justify-content: space-between; align-items: center; }
  .record-table { width: 100%; border-collapse: collapse; }
  .record-table td, .record-table th { border: 1px solid #ddd; padding: 6px; }
  .el-select, .el-cascader, .el-date-editor { width: 300px; }
  .chat-widget { position: fixed; right: 8px; bottom: 8px; width: 170px; height: 170px; }
  .chat-widget iframe { width: 100%; height: 100%; border: 0; border-radius: 50%; }
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
